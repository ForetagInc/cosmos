name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # npm signs the provenance attestation with a GitHub OIDC token.
  id-token: write

# Keep in sync with ci.yml and `packageManager` in package.json.
env:
  BUN_VERSION: 1.3.14

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Fail before the long build rather than after it. `-z` alone would let a
      # secret that is only whitespace through, and npm reads that as no auth.
      - name: Verify NPM_TOKEN is present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN//[[:space:]]/}" ]; then
            echo "NPM_TOKEN secret is missing or blank" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest would publish the wrong version.
      - name: Verify tag matches package version
        run: |
          version=$(bun --print "require('./packages/cosmos/package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME expects version $tagged, but package.json says $version" >&2
            exit 1
          fi
          echo "Publishing @foretag/cosmos@$version"

      # A publish cannot be taken back, so gate it on the same checks as CI.
      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit

      # typecheck already builds the package; rebuild so dist cannot be stale.
      - name: Build package
        run: bun run build:cosmos

      # A prerelease must not land on the `latest` dist-tag, or `bun add
      # @foretag/cosmos` would install it for everyone.
      - name: Resolve dist-tag
        run: |
          version=$(bun --print "require('./packages/cosmos/package.json').version")
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          else
            tag=latest
          fi
          echo "Using dist-tag $tag"
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      # npm does the publishing because `bun publish` has no --provenance flag.
      # Set up last: this points NPM_CONFIG_USERCONFIG at a temp .npmrc, and the
      # bun steps above should keep resolving config the way CI does.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show tarball contents
        run: npm pack --dry-run
        working-directory: packages/cosmos

      # Surface a bad token here, with npm's own message, instead of after the
      # tarball has been built and uploaded.
      - name: Verify registry auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --tag "$DIST_TAG"
        working-directory: packages/cosmos
