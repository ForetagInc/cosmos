name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # npm exchanges this OIDC token for short-lived publish credentials, and signs
  # the provenance attestation with it. Trusted publishing does not work without it.
  id-token: write

# Keep in sync with ci.yml and `packageManager` in package.json.
env:
  BUN_VERSION: 1.3.14

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest would publish the wrong version.
      - name: Verify tag matches package version
        run: |
          version=$(bun --print "require('./packages/cosmos/package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME expects version $tagged, but package.json says $version" >&2
            exit 1
          fi
          echo "Publishing @foretag/cosmos@$version"

      # Lint, typecheck and tests are not repeated here: the CI workflow runs on
      # this same push, against the same commit.
      - name: Build package
        run: bun run build:cosmos

      # A prerelease must not land on the `latest` dist-tag, or `bun add
      # @foretag/cosmos` would install it for everyone.
      - name: Resolve dist-tag
        run: |
          version=$(bun --print "require('./packages/cosmos/package.json').version")
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          else
            tag=latest
          fi
          echo "Using dist-tag $tag"
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      # npm does the publishing because `bun publish` supports neither provenance
      # nor OIDC. No `registry-url` here on purpose: that writes an `_authToken`
      # line into the .npmrc, and there is no token to put in it.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # OIDC trusted publishing needs npm 11.5.1+, which is newer than the npm
      # bundled with some Node 24 releases.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Show tarball contents
        run: npm pack --dry-run
        working-directory: packages/cosmos

      # No NODE_AUTH_TOKEN: npm authenticates via the OIDC token above, against
      # the trusted publisher configured for @foretag/cosmos on npmjs.com.
      - name: Publish
        run: npm publish --provenance --tag "$DIST_TAG"
        working-directory: packages/cosmos
